name: cPanel Automated Deployment

on:
  push:
    branches:
      - main  # Triggers deployment when you push code to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js Environment
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies & Build Next.js
      run: |
        npm install
        npm run build
      env:
        NEXT_PUBLIC_SANITY_PROJECT_ID: "33xgn627"
        NEXT_PUBLIC_SANITY_DATASET: "production"

    - name: Deploy Production Files via rsync over SSH
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        REMOTE_HOST: ${{ secrets.SERVER_IP }}
        REMOTE_USER: "nursing1"  # Your exact cPanel account username
        TARGET: "/home3/nursing1/elpiswellness.co.ke/" # Live server web directory root
        EXCLUDE: "/node_modules/, /.git/, /.github/, /src/" # Skips developmental source assets